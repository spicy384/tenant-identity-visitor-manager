# Keeps the volume names the same whatever this folder is called.
name: identity-visitor-manager

services:
  identity:
    # The published image, built by GitHub Actions from main for amd64 and arm64:
    #   docker compose pull && docker compose up -d
    # Or build from this checkout, which tags the result with the same name:
    #   docker compose up -d --build
    image: ghcr.io/spicy384/tenant-identity-visitor-manager:latest
    build: .
    container_name: identity-visitor-manager
    restart: unless-stopped

    # 3000: the staff pages and APIs. 3001: the lobby kiosks, and nothing else.
    # With a reverse proxy on another host, let only the proxy reach these (host
    # firewall, or bind to one interface, e.g. "192.168.1.20:3000:3000").
    ports:
      - "3000:3000"
      - "3001:3001"

    environment:
      PORT: 3000
      DATA_DIR: /data
      TZ: ${TZ:-UTC}

      # The database key. On the first start the app makes one in the identity-keys
      # volume. Copy it into your password manager straight away; without it the data
      # can't be read:  docker compose exec identity cat /keys/db_key
      DB_KEY_FILE: /keys/db_key
      DB_KEY_CREATE: "true"

      # The addresses people use, behind the proxy (https://directory.example.com,
      # https://visitors.example.com). Optional; needed for Microsoft sign-in.
      APP_URL: ${APP_URL:-}
      KIOSK_PORT: ${KIOSK_PORT-3001}
      KIOSK_URL: ${KIOSK_URL:-}

      # HTTPS with a self-signed certificate the app makes, for the hop from the proxy
      # (set the proxy's scheme to https). Browsers connecting directly will warn.
      TLS_ENABLED: ${TLS_ENABLED:-true}
      TLS_HOSTS: ${TLS_HOSTS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

    # Anything else (Entra sign-in, proxy trust, how long SSN digits are held) goes in a
    # .env file next to this one, if you need it: see "Settings in the environment" in
    # the README. Values there also override the defaults above.
    env_file:
      - path: .env
        required: false

    volumes:
      - identity-data:/data
      - identity-keys:/keys

    # One instance: SQLite wants a single writer.
    deploy:
      replicas: 1

    # Hardening. The memory limits keep the process off swap and no core files are
    # written: SSN digits for clearance validation live only in memory.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    memswap_limit: 512m
    ulimits:
      core: 0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  identity-data:
  identity-keys:
